version: '3.8'

services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: always
    networks:
      - app-network

  backend:
    build: ./backend
    depends_on:
      - mongodb
    env_file:
      - .env.prod
    restart: always
    networks:
      - app-network
    environment:
      - MONGODB_URL=mongodb://mongodb:27017

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=/api
        - REACT_APP_WS_URL=wss://${DOMAIN:-localhost}
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
